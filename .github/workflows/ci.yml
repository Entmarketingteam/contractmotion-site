name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build check (static asset + nginx clean-route integrity)
        run: npm run check-assets

      - name: Run tests
        run: npm test

      - name: Build (Docker/nginx static site — verify deploy image builds)
        run: docker build -t contractmotion-site:ci .
